name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vanilla-hermes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hermes-livekit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: hermes-livekit
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.9
      - name: Install test environment
        working-directory: hermes-livekit
        run: scripts/bootstrap_tests.sh
      - name: Run vanilla compatibility suite
        working-directory: hermes-livekit
        run: scripts/run_tests.sh
