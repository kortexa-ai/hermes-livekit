[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-livekit"
version = "0.4.0"
description = "LiveKit WebRTC voice gateway plugin for hermes-agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "kortexa.ai", email = "info@kortexa.ai" }]
license = "MIT"
dependencies = [
  "hermes-agent>=0.20.0",
  # Exact pins (mirrors hermes-agent's 2026-05-12 supply-chain hardening
  # policy): PyPI cannot ship a new livekit/livekit-api/Pillow into a
  # user's install without an intentional bump here. Update the pins
  # AND verify release notes / security advisories before changing.
  #   livekit==1.1.14     released 2026-07-31, no yanks; includes
  #                        remote-disconnect queue cleanup and race fixes.
  #   livekit-api==1.2.0   released 2026-07-11, no yanks.
  #   Pillow==12.3.0       released 2026-07-01, no yanks. Used to JPEG-
  #                        encode sampled video frames before handing them
  #                        to Hermes' vision pipeline via media_urls.
  "livekit==1.1.14",
  "livekit-api==1.2.0",
  "Pillow==12.3.0",
  # Direct OpenAI-compatible WebRTC signalling and media. aiortc 1.15.0
  # requires av>=14,<18; pinning the selected wheel keeps installs deliberate.
  "aiohttp==3.14.3",
  "aiortc==1.15.0",
  "av==17.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[project.entry-points."hermes_agent.plugins"]
# Point to the package, not the function — the hermes-agent plugin loader
# does ep.load() and then getattr(module, "register"), so the target must
# resolve to the module itself.
livekit = "hermes_livekit"

[tool.setuptools.packages.find]
include = ["hermes_livekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
